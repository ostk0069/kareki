version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Wait a few days after a release before opening a PR. Lets the
    # ecosystem surface broken or yanked releases (cf. the
    # `tj-actions/changed-files` compromise) before we adopt them.
    # github-actions only supports `default-days` for cooldown.
    cooldown:
      default-days: 7

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      dart-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
