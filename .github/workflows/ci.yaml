name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.10.0", "3.11.0", "3.12.0", "3.13.0", "stable"]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print versions
        run: dart --version

      - name: Resolve dependencies
        run: dart pub get

      - name: Check formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Resolve l10n consumer fixtures
        run: dart pub get --directory test/fixtures/l10n_consumers --enforce-lockfile

      - name: Run tests
        run: dart test

      - name: Smoke test the CLI
        # Just exercise the binary so build-only failures are caught.
        run: dart run bin/kareki.dart --help

      - name: Verify example/ exercises every rule
        # Runs kareki against the example package and asserts each rule
        # id fires exactly once. Guards against the example drifting
        # out of sync with the detectors it's supposed to demonstrate.
        run: |
          (cd example && dart pub get)
          dart run tool/verify_example.dart

  analyzer-boundaries:
    name: Analyzer (${{ matrix.boundary }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - boundary: minimum 10.2.0
            sdk: 3.10.0
          - boundary: latest allowed
            sdk: stable
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolve minimum analyzer
        if: matrix.boundary == 'minimum 10.2.0'
        run: dart pub add analyzer:10.2.0

      - name: Resolve latest allowed analyzer
        if: matrix.boundary == 'latest allowed'
        run: dart pub upgrade

      - name: Print resolved analyzer
        run: dart pub deps --style=compact

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Resolve l10n consumer fixtures
        run: dart pub get --directory test/fixtures/l10n_consumers --enforce-lockfile

      - name: Run tests
        run: dart test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Resolve l10n consumer fixtures
        run: dart pub get --directory test/fixtures/l10n_consumers --enforce-lockfile

      - name: Run tests with coverage
        run: dart run test --coverage-path=coverage/lcov.info

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Validate package for pub.dev
        # Catches .pubignore gaps, missing LICENSE/README, pub score
        # regressions, and version/CHANGELOG drift before tagging.
        run: dart pub publish --dry-run

  flutter-localizations:
    name: Flutter gen-l10n (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum stable Dart 3.10 SDK, verified application SDK, and latest stable.
        # Flutter 3.38.0 bundled a prerelease Dart SDK; use the next patch.
        flutter: ["3.38.1", "3.41.4", "stable"]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare Flutter SDK
        env:
          FLUTTER_REF: ${{ matrix.flutter }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_REF" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/dart" --version
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve kareki dependencies
        run: dart pub get
      - name: Test actual generated localization APIs
        env:
          KAREKI_FLUTTER_BIN: ${{ runner.temp }}/flutter/bin/flutter
        run: dart test test/runner/flutter_gen_l10n_test.dart
