name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.10.0", "3.11.0", "3.12.0", "3.13.0", "stable"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print versions
        run: dart --version

      - name: Resolve dependencies
        run: dart pub get

      - name: Check formatting
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Run tests
        run: dart test

      - name: Smoke test the CLI
        # Just exercise the binary so build-only failures are caught.
        run: dart run bin/kareki.dart --help

      - name: Verify example/ exercises every rule
        # Runs kareki against the example package and asserts each rule
        # id fires exactly once. Guards against the example drifting
        # out of sync with the detectors it's supposed to demonstrate.
        run: dart run tool/verify_example.dart

  analyzer-boundaries:
    name: Analyzer (${{ matrix.boundary }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - boundary: minimum 10.2.0
            sdk: 3.10.0
          - boundary: latest allowed
            sdk: stable
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolve minimum analyzer
        if: matrix.boundary == 'minimum 10.2.0'
        run: dart pub add analyzer:10.2.0

      - name: Resolve latest allowed analyzer
        if: matrix.boundary == 'latest allowed'
        run: dart pub upgrade

      - name: Print resolved analyzer
        run: dart pub deps --style=compact

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Run tests
        run: dart test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Run tests with coverage
        run: dart run test --coverage-path=coverage/lcov.info

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Validate package for pub.dev
        # Catches .pubignore gaps, missing LICENSE/README, pub score
        # regressions, and version/CHANGELOG drift before tagging.
        run: dart pub publish --dry-run
