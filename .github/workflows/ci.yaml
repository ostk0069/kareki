name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test against the minimum supported Dart SDK and the latest
        # stable. Bump `min` when bumping `environment.sdk` in
        # pubspec.yaml.
        sdk: ["3.10.0", "stable"]
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print versions
        run: dart --version

      - name: Resolve dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-warnings

      - name: Run tests
        run: dart test

      - name: Smoke test the CLI
        # Just exercise the binary so build-only failures are caught.
        run: dart run bin/kareki.dart --help

      - name: Verify example/ exercises every rule
        # Runs kareki against the example package and asserts each rule
        # id fires exactly once. Guards against the example drifting
        # out of sync with the detectors it's supposed to demonstrate.
        run: dart run tool/verify_example.dart

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Validate package for pub.dev
        # Catches .pubignore gaps, missing LICENSE/README, pub score
        # regressions, and version/CHANGELOG drift before tagging.
        run: dart pub publish --dry-run
