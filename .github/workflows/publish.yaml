name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  publish:
    permissions:
      # Required for OIDC token exchange with pub.dev. No long-lived
      # `PUB_DEV_PUBLISH_*` secrets are needed.
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      environment: pub.dev
