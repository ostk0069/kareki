name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    permissions:
      # Required for OIDC token exchange with pub.dev. No long-lived
      # `PUB_DEV_PUBLISH_*` secrets are needed.
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
    with:
      environment: pub.dev
