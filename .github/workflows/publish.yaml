name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require main ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_release.py

  publish:
    needs: verify
    permissions:
      # Required for OIDC token exchange with pub.dev. No long-lived
      # `PUB_DEV_PUBLISH_*` secrets are needed.
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      environment: pub.dev
